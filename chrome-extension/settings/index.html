<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tab Walker Settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="settings-container">
    <header class="header">
      <h2>Tab Walker Settings</h2>
    </header>

    <form id="settings-form" class="settings-form">
      <!-- Dark Mode -->
      <div class="setting-row">
        <label for="isDarkTheme" class="setting-label">
          <span>Dark Theme</span>
          <small>Use dark colors for the overlay card</small>
        </label>
        <input type="checkbox" id="isDarkTheme" class="toggle-switch">
      </div>

      <!-- Popup Width -->
      <div class="slider-group" data-unit="px">
        <div class="slider-header">
          <label for="popupWidth" class="slider-label">Popup Width</label>
          <span class="slider-badge" id="popupWidth-badge">460px</span>
        </div>
        <div class="capsule-track-wrapper">
          <input type="range" id="popupWidth" min="300" max="800" step="25" value="460" class="capsule-range-input">
          <div class="capsule-track">
            <div class="ticks-container" id="popupWidth-ticks"></div>
            <div class="capsule-thumb" id="popupWidth-thumb"></div>
          </div>
        </div>
      </div>

      <!-- Max Window Height -->
      <div class="slider-group" data-unit="px">
        <div class="slider-header">
          <label for="windowHeight" class="slider-label">Max Window Height</label>
          <span class="slider-badge" id="windowHeight-badge">500px</span>
        </div>
        <div class="capsule-track-wrapper">
          <input type="range" id="windowHeight" min="200" max="900" step="25" value="500" class="capsule-range-input">
          <div class="capsule-track">
            <div class="ticks-container" id="windowHeight-ticks"></div>
            <div class="capsule-thumb" id="windowHeight-thumb"></div>
          </div>
        </div>
      </div>

      <!-- Font Size -->
      <div class="slider-group" data-unit="px">
        <div class="slider-header">
          <label for="fontSize" class="slider-label">Font Size</label>
          <span class="slider-badge" id="fontSize-badge">15px</span>
        </div>
        <div class="capsule-track-wrapper">
          <input type="range" id="fontSize" min="12" max="22" step="1" value="15" class="capsule-range-input">
          <div class="capsule-track">
            <div class="ticks-container" id="fontSize-ticks"></div>
            <div class="capsule-thumb" id="fontSize-thumb"></div>
          </div>
        </div>
      </div>

      <!-- Icon Size -->
      <div class="slider-group" data-unit="px">
        <div class="slider-header">
          <label for="iconSize" class="slider-label">Icon Size</label>
          <span class="slider-badge" id="iconSize-badge">20px</span>
        </div>
        <div class="capsule-track-wrapper">
          <input type="range" id="iconSize" min="14" max="32" step="2" value="20" class="capsule-range-input">
          <div class="capsule-track">
            <div class="ticks-container" id="iconSize-ticks"></div>
            <div class="capsule-thumb" id="iconSize-thumb"></div>
          </div>
        </div>
      </div>

      <!-- Opacity -->
      <div class="slider-group" data-unit="%">
        <div class="slider-header">
          <label for="opacity" class="slider-label">Overlay Opacity</label>
          <span class="slider-badge" id="opacity-badge">100%</span>
        </div>
        <div class="capsule-track-wrapper">
          <input type="range" id="opacity" min="50" max="100" step="5" value="100" class="capsule-range-input">
          <div class="capsule-track">
            <div class="ticks-container" id="opacity-ticks"></div>
            <div class="capsule-thumb" id="opacity-thumb"></div>
          </div>
        </div>
      </div>

      <!-- Switch on close -->
      <div class="setting-row">
        <label for="isSwitchingToPreviouslyUsedTab" class="setting-label">
          <span>Switch Tab on Close</span>
          <small>Activate previously used tab when current tab closes</small>
        </label>
        <input type="checkbox" id="isSwitchingToPreviouslyUsedTab" class="toggle-switch" checked>
      </div>

      <!-- Actions -->
      <div class="actions">
        <button type="button" id="reset-btn" class="btn btn-secondary">Reset Defaults</button>
        <span id="save-status" class="save-status">Saved!</span>
      </div>
    </form>
  </div>

  <script src="index.js"></script>
</body>
</html>
