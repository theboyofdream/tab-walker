<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tab Walker Settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">
  <div class="settings-container">
    <header class="header">
      <h2>Tab Walker Settings</h2>
    </header>

    <form id="settings-form" class="settings-form">
      <!-- Theme Selection -->
      <div class="setting-row">
        <label class="setting-label">Theme</label>
        <div class="segmented-control" id="theme-button-group" role="radiogroup" aria-label="Theme Selection">
          <button type="button" class="segmented-btn" data-value="system" role="radio" aria-checked="false">System</button>
          <button type="button" class="segmented-btn" data-value="light" role="radio" aria-checked="false">Light</button>
          <button type="button" class="segmented-btn" data-value="dark" role="radio" aria-checked="false">Dark</button>
          <input type="hidden" id="theme" value="system">
        </div>
      </div>

      <!-- Popup Width -->
      <div class="slider-group" data-unit="px">
        <div class="slider-header">
          <label for="popupWidth" class="slider-label">Popup Width</label>
          <span class="slider-badge" id="popupWidth-badge">460px</span>
        </div>
        <div class="capsule-track-wrapper">
          <input type="range" id="popupWidth" min="300" max="800" step="25" value="460" class="capsule-range-input">
          <div class="capsule-track">
            <div class="capsule-fill" id="popupWidth-fill"></div>
            <div class="ticks-container" id="popupWidth-ticks"></div>
            <div class="capsule-thumb" id="popupWidth-thumb"></div>
          </div>
        </div>
      </div>

      <!-- Max Window Height -->
      <div class="slider-group" data-unit="px">
        <div class="slider-header">
          <label for="windowHeight" class="slider-label">Max Window Height</label>
          <span class="slider-badge" id="windowHeight-badge">500px</span>
        </div>
        <div class="capsule-track-wrapper">
          <input type="range" id="windowHeight" min="200" max="900" step="25" value="500" class="capsule-range-input">
          <div class="capsule-track">
            <div class="capsule-fill" id="windowHeight-fill"></div>
            <div class="ticks-container" id="windowHeight-ticks"></div>
            <div class="capsule-thumb" id="windowHeight-thumb"></div>
          </div>
        </div>
      </div>

      <!-- Item Height -->
      <div class="slider-group" data-unit="px">
        <div class="slider-header">
          <label for="tabHeight" class="slider-label">Item Height</label>
          <span class="slider-badge" id="tabHeight-badge">42px</span>
        </div>
        <div class="capsule-track-wrapper">
          <input type="range" id="tabHeight" min="28" max="60" step="2" value="42" class="capsule-range-input">
          <div class="capsule-track">
            <div class="capsule-fill" id="tabHeight-fill"></div>
            <div class="ticks-container" id="tabHeight-ticks"></div>
            <div class="capsule-thumb" id="tabHeight-thumb"></div>
          </div>
        </div>
      </div>

      <!-- Font Size -->
      <div class="slider-group" data-unit="px">
        <div class="slider-header">
          <label for="fontSize" class="slider-label">Font Size</label>
          <span class="slider-badge" id="fontSize-badge">15px</span>
        </div>
        <div class="capsule-track-wrapper">
          <input type="range" id="fontSize" min="12" max="22" step="1" value="15" class="capsule-range-input">
          <div class="capsule-track">
            <div class="capsule-fill" id="fontSize-fill"></div>
            <div class="ticks-container" id="fontSize-ticks"></div>
            <div class="capsule-thumb" id="fontSize-thumb"></div>
          </div>
        </div>
      </div>

      <!-- Icon Size -->
      <div class="slider-group" data-unit="px">
        <div class="slider-header">
          <label for="iconSize" class="slider-label">Icon Size</label>
          <span class="slider-badge" id="iconSize-badge">20px</span>
        </div>
        <div class="capsule-track-wrapper">
          <input type="range" id="iconSize" min="14" max="32" step="2" value="20" class="capsule-range-input">
          <div class="capsule-track">
            <div class="capsule-fill" id="iconSize-fill"></div>
            <div class="ticks-container" id="iconSize-ticks"></div>
            <div class="capsule-thumb" id="iconSize-thumb"></div>
          </div>
        </div>
      </div>

      <!-- Opacity -->
      <div class="slider-group" data-unit="%">
        <div class="slider-header">
          <label for="opacity" class="slider-label">Overlay Opacity</label>
          <span class="slider-badge" id="opacity-badge">100%</span>
        </div>
        <div class="capsule-track-wrapper">
          <input type="range" id="opacity" min="50" max="100" step="5" value="100" class="capsule-range-input">
          <div class="capsule-track">
            <div class="capsule-fill" id="opacity-fill"></div>
            <div class="ticks-container" id="opacity-ticks"></div>
            <div class="capsule-thumb" id="opacity-thumb"></div>
          </div>
        </div>
      </div>

      <!-- Overlay Blur -->
      <div class="slider-group" data-unit="px">
        <div class="slider-header">
          <label for="overlayBlur" class="slider-label">Overlay Blur</label>
          <span class="slider-badge" id="overlayBlur-badge">0px</span>
        </div>
        <div class="capsule-track-wrapper">
          <input type="range" id="overlayBlur" min="0" max="20" step="1" value="0" class="capsule-range-input">
          <div class="capsule-track">
            <div class="capsule-fill" id="overlayBlur-fill"></div>
            <div class="ticks-container" id="overlayBlur-ticks"></div>
            <div class="capsule-thumb" id="overlayBlur-thumb"></div>
          </div>
        </div>
      </div>

      <!-- Switch on close -->
      <div class="setting-row">
        <label for="isSwitchingToPreviouslyUsedTab" class="setting-label">
          <span>Switch Tab on Close</span>
          <small>Activate previously used tab when current tab closes</small>
        </label>
        <div class="craft-toggle-wrapper">
          <input type="checkbox" id="isSwitchingToPreviouslyUsedTab" class="craft-toggle-input" role="switch" aria-checked="true" checked>
          <div class="craft-toggle-track">
            <div class="craft-toggle-thumb"></div>
          </div>
        </div>
      </div>

      <!-- Custom CSS Overrides -->
      <div class="custom-css-group">
        <label for="customCss" class="setting-label">
          <span>Custom CSS Overrides</span>
          <small>Paste custom CSS rules or token overrides here</small>
        </label>
        <textarea id="customCss" class="custom-css-textarea" placeholder="/* Example: .tw-card { --tw-bg-card: #0F172A; } */" rows="4"></textarea>
      </div>

      <!-- Actions -->
      <div class="actions">
        <button type="button" id="reset-btn" class="btn btn-secondary">Reset Defaults</button>
        <span id="save-status" class="save-status">Saved!</span>
      </div>
    </form>
  </div>

  <script src="index.js"></script>
</body>
</html>
