<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Front Tab Gradient -->
    <linearGradient id="frontCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282A33" />
      <stop offset="100%" stop-color="#1E2027" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.4" />
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Back Tab Card (Muted / Background Tab) -->
  <rect x="28" y="28" width="56" height="42" rx="10" fill="#1B1C22" stroke="rgba(255,255,255,0.07)" stroke-width="1.5" opacity="0.75" />
  
  <!-- Back Tab Indicator Dots -->
  <circle cx="38" cy="38" r="2.5" fill="rgba(255,255,255,0.2)" />
  <rect x="46" y="36.5" width="22" height="3" rx="1.5" fill="rgba(255,255,255,0.12)" />

  <!-- Front Tab Card (Active Focus) -->
  <rect x="44" y="46" width="56" height="54" rx="12" fill="url(#frontCardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#cardShadow)" />
  
  <!-- Active Tab Accent Header Bar -->
  <path d="M44 58 C44 51.37 49.37 46 56 46 L88 46 C94.63 46 100 51.37 100 58 L100 62 L44 62 Z" fill="rgba(255,255,255,0.03)" />
  
  <!-- Tab Notch Indicator / Light Accent -->
  <rect x="54" y="53" width="18" height="3.5" rx="1.75" fill="url(#accentGrad)" filter="url(#glow)" />
  <circle cx="88" cy="54.5" r="2" fill="rgba(255,255,255,0.3)" />

  <!-- Directional Switcher Arrows (Walker motif) -->
  <path d="M56 75 L76 75 M71 70 L76 75 L71 80" fill="none" stroke="#F1F3F5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M88 85 L68 85 M73 90 L68 85 L73 80" fill="none" stroke="#6C707E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
</svg>
